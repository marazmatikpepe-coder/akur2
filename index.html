function spatial(dir,root){const a=document.activeElement,els=[...root.querySelectorAll("button,input,select,textarea,[tabindex='0']")].filter(x=>x.offsetParent&&!x.disabled);if(!els.length)return;

 if(best){best.focus();best.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"})}}
